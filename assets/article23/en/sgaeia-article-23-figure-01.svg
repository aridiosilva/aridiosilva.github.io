<text x="792.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="792.0" dy="0.0">Configurations where nothing is cheaper without</tspan><tspan x="792.0" dy="17.6">also being worse.</tspan></text>
<text x="792.0" y="131.6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#0e6e6a" font-weight="700" text-anchor="start"><tspan x="792.0" dy="0.0">Dominated point</tspan></text>
<text x="792.0" y="153.6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="792.0" dy="0.0">Sending every request to the frontier model pays</tspan><tspan x="792.0" dy="17.6">for capability most requests do not use.</tspan></text>
<text x="792.0" y="209.1" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#0e6e6a" font-weight="700" text-anchor="start"><tspan x="792.0" dy="0.0">Operating point</tspan></text>
<text x="792.0" y="231.1" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="792.0" dy="0.0">Fix a quality floor (SLO) first, then minimise</tspan><tspan x="792.0" dy="17.6">cost per successful task.</tspan></text>
<text x="792.0" y="286.7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a35a06" font-weight="700" text-anchor="start"><tspan x="792.0" dy="0.0">Key takeaway</tspan></text>
<text x="792.0" y="308.7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="792.0" dy="0.0">Spend more intelligence only when the task</tspan><tspan x="792.0" dy="17.6">actually needs it.</tspan></text>
