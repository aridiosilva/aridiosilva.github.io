<text x="48" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0e6e6a" letter-spacing="1.2">FIGURA 9</text>
<text x="48" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#14213d">Portão de qualidade: checagens mais baratas primeiro, escalonamento limitado</text>
<text x="1170" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b6474" text-anchor="end">Camadas de checagem e desfechos</text>
<g transform="translate(0,96)">
<rect x="30.0" y="0.0" width="400.0" height="82.0" rx="10" fill="#ddf1e4" stroke="#1d7a3e" stroke-width="1.2"/>
<text x="46.0" y="26.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1d7a3e" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">1 · Determinísticas</tspan></text>
<text x="46.0" y="48.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">JSON schema, campos obrigatórios, IDs</tspan><tspan x="46.0" dy="16.2">citados existem, limites de tamanho</tspan></text>
<text x="416.0" y="26.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b6474" font-weight="600" text-anchor="end"><tspan x="416.0" dy="0.0">custo ≈ 0 · ms</tspan></text>
<path d="M70.0,82.0 L70.0,96.0" fill="none" stroke="#14213d" stroke-width="1.5" marker-end="url(#m14213d)"/>
<rect x="30.0" y="98.0" width="470.0" height="82.0" rx="10" fill="#d9efec" stroke="#0e6e6a" stroke-width="1.2"/>
<text x="46.0" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#0e6e6a" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">2 · Classificadores</tspan></text>
<text x="46.0" y="146.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">Segurança, PII, sinais de prompt injection,</tspan><tspan x="46.0" dy="16.2">regras de política</tspan></text>
<text x="486.0" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b6474" font-weight="600" text-anchor="end"><tspan x="486.0" dy="0.0">custo baixo · dezenas de ms</tspan></text>
<path d="M70.0,180.0 L70.0,194.0" fill="none" stroke="#14213d" stroke-width="1.5" marker-end="url(#m14213d)"/>
<rect x="30.0" y="196.0" width="540.0" height="82.0" rx="10" fill="#fbecd6" stroke="#a35a06" stroke-width="1.2"/>
<text x="46.0" y="222.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a35a06" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">3 · Fundamentação</tspan></text>
<text x="46.0" y="244.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">Cada afirmação apoiada pela evidência (NLI, faithfulness do</tspan><tspan x="46.0" dy="16.2">RAGAS), cobertura de citações</tspan></text>
<text x="556.0" y="222.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b6474" font-weight="600" text-anchor="end"><tspan x="556.0" dy="0.0">custo médio</tspan></text>
<path d="M70.0,278.0 L70.0,292.0" fill="none" stroke="#14213d" stroke-width="1.5" marker-end="url(#m14213d)"/>
<rect x="30.0" y="294.0" width="610.0" height="82.0" rx="10" fill="#ebe5f8" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="46.0" y="320.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#5b3fa8" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">4 · Julgamento por modelo</tspan></text>
<text x="46.0" y="342.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">Rubrica com LLM-juiz, autoconsistência (SelfCheckGPT); amostral ou só</tspan><tspan x="46.0" dy="16.2">alto risco</tspan></text>
<text x="626.0" y="320.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b6474" font-weight="600" text-anchor="end"><tspan x="626.0" dy="0.0">custo mais alto</tspan></text>
<text x="30.0" y="404.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#5b6474" font-weight="600" text-anchor="start"><tspan x="30.0" dy="0.0">Execute em ordem; pare na primeira falha grave. O custo cresce para baixo.</tspan></text>
<path d="M640.0,190.0 L752.0,190.0" fill="none" stroke="#14213d" stroke-width="2" marker-end="url(#m14213d)"/>
