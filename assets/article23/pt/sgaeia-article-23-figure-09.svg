<text x="784.0" y="34.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1d7a3e" font-weight="700" text-anchor="start"><tspan x="784.0" dy="0.0">PASSA</tspan></text>
<text x="784.0" y="58.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="784.0" dy="0.0">Responde, registra trace e custo, grava no cache se</tspan><tspan x="784.0" dy="16.2">elegível</tspan></text>
<rect x="760.0" y="98.0" width="410.0" height="80.0" rx="10" fill="#fff" stroke="#a35a06" stroke-width="1.6"/>
<rect x="760.0" y="98.0" width="8.0" height="80.0" rx="3" fill="#a35a06" stroke="none" stroke-width="1.2"/>
<text x="784.0" y="126.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a35a06" font-weight="700" text-anchor="start"><tspan x="784.0" dy="0.0">REPARA</tspan></text>
<text x="784.0" y="150.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="784.0" dy="0.0">Uma nova tentativa com a mensagem de erro do validador</tspan></text>
<rect x="760.0" y="190.0" width="410.0" height="80.0" rx="10" fill="#fff" stroke="#1f3a68" stroke-width="1.6"/>
<rect x="760.0" y="190.0" width="8.0" height="80.0" rx="3" fill="#1f3a68" stroke="none" stroke-width="1.2"/>
<text x="784.0" y="218.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f3a68" font-weight="700" text-anchor="start"><tspan x="784.0" dy="0.0">ESCALA</tspan></text>
<text x="784.0" y="242.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="784.0" dy="0.0">Envia ao próximo nível; no máximo um salto</tspan></text>
<rect x="760.0" y="282.0" width="410.0" height="80.0" rx="10" fill="#fff" stroke="#b42318" stroke-width="1.6"/>
<rect x="760.0" y="282.0" width="8.0" height="80.0" rx="3" fill="#b42318" stroke="none" stroke-width="1.2"/>
<text x="784.0" y="310.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="784.0" dy="0.0">ABSTÉM / HUMANO</tspan></text>
<text x="784.0" y="334.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="784.0" dy="0.0">Recusa com segurança ou repassa com contexto</tspan></text>
<rect x="760.0" y="380.0" width="410.0" height="76.0" rx="10" fill="#f4f7fa" stroke="#c9d1dc" stroke-width="1.2"/>
<text x="776.0" y="404.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="776.0" dy="0.0">Guarda de orçamento: ≤ 1 nova tentativa, ≤ 1 escalonamento,</tspan><tspan x="776.0" dy="15.6">teto de custo por requisição. Calibre juízes com rótulos</tspan><tspan x="776.0" dy="15.6">humanos: vieses de posição, verbosidade e autopreferência</tspan><tspan x="776.0" dy="15.6">(Zheng et al. 2023).</tspan></text>
