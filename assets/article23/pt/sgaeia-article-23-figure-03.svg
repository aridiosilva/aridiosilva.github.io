<text x="382.0" y="68.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="382.0" dy="0.0">Corte de até 98% com acurácia do GPT-4 (FrugalGPT);</tspan><tspan x="382.0" dy="15.6">&gt;2× mais barato (RouteLLM); 40% menos chamadas ao</tspan><tspan x="382.0" dy="15.6">modelo grande (Hybrid LLM).</tspan></text>
