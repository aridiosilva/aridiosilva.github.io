<rect x="30" y="22" width="6" height="52" rx="3" fill="#0e6e6a"/>
<text x="48" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0e6e6a" letter-spacing="1.2">FIGURA 6</text>
<text x="48" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#14213d">Três camadas de cache frequentemente confundidas</text>
<text x="1170" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b6474" text-anchor="end">O que cada camada reutiliza e arrisca</text>
<g transform="translate(0,96)">
<rect x="30.0" y="0.0" width="1140.0" height="36.0" rx="8" fill="#14213d" stroke="none" stroke-width="1.2"/>
<text x="46.0" y="24.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">Camada</tspan></text>
<text x="250.0" y="24.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="start"><tspan x="250.0" dy="0.0">Reutiliza</tspan></text>
<text x="480.0" y="24.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="start"><tspan x="480.0" dy="0.0">Regra de match</tspan></text>
<text x="710.0" y="24.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="start"><tspan x="710.0" dy="0.0">Economiza</tspan></text>
<text x="930.0" y="24.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="start"><tspan x="930.0" dy="0.0">Principal risco</tspan></text>
<rect x="30.0" y="46.0" width="1140.0" height="116.0" rx="10" fill="#fbecd6" stroke="#a35a06" stroke-width="1"/>
<text x="46.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#a35a06" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">Cache semântico</tspan></text>
<text x="46.0" y="98.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#5b6474" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">Camada de aplicação (A4)</tspan></text>
<text x="250.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="250.0" dy="0.0">A resposta final inteira</tspan></text>
<text x="480.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="480.0" dy="0.0">Similaridade de embedding ≥ τ</tspan><tspan x="480.0" dy="16.2">dentro do escopo</tspan><tspan x="480.0" dy="16.2">tenant/ACL/versão</tspan></text>
<text x="710.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="710.0" dy="0.0">O pipeline inteiro: custo e</tspan><tspan x="710.0" dy="16.2">latência</tspan></text>
<text x="930.0" y="76.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="930.0" dy="0.0">Acertos falsos, respostas</tspan><tspan x="930.0" dy="16.2">velhas, vazamento entre tenants</tspan></text>
<rect x="30.0" y="172.0" width="1140.0" height="116.0" rx="10" fill="#ebe5f8" stroke="#5b3fa8" stroke-width="1"/>
<text x="46.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5b3fa8" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">Prompt / prefix cache</tspan></text>
<text x="46.0" y="224.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#5b6474" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">API do provedor (A3)</tspan></text>
<text x="250.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="250.0" dy="0.0">Prefixo de prompt já processado</tspan><tspan x="250.0" dy="16.2">(estados de atenção)</tspan></text>
<text x="480.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="480.0" dy="0.0">Match exato de prefixo; ≥ 1.024</tspan><tspan x="480.0" dy="16.2">tokens (OpenAI), breakpoints</tspan><tspan x="480.0" dy="16.2">explícitos (Anthropic)</tspan></text>
<text x="710.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="710.0" dy="0.0">Preço de entrada (leitura 0,1×</tspan><tspan x="710.0" dy="16.2">na Anthropic) e tempo até o 1º</tspan><tspan x="710.0" dy="16.2">token</tspan></text>
<text x="930.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="930.0" dy="0.0">Custo de escrita, TTL curto,</tspan><tspan x="930.0" dy="16.2">canal lateral de tempo se</tspan><tspan x="930.0" dy="16.2">compartilhado</tspan></text>
<rect x="30.0" y="298.0" width="1140.0" height="116.0" rx="10" fill="#e5e9ef" stroke="#475569" stroke-width="1"/>
<text x="46.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#475569" font-weight="700" text-anchor="start"><tspan x="46.0" dy="0.0">KV cache</tspan></text>
<text x="46.0" y="350.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#5b6474" font-weight="400" text-anchor="start"><tspan x="46.0" dy="0.0">Motor de inferência (self-</tspan><tspan x="46.0" dy="16.2">hosted)</tspan></text>
<text x="250.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="250.0" dy="0.0">Tensores key/value dentro e</tspan><tspan x="250.0" dy="16.2">entre requisições</tspan></text>
<text x="480.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="480.0" dy="0.0">Árvore de prefixos por token</tspan><tspan x="480.0" dy="16.2">(RadixAttention), blocos</tspan><tspan x="480.0" dy="16.2">paginados (PagedAttention)</tspan></text>
<text x="710.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="710.0" dy="0.0">Memória de GPU e throughput</tspan></text>
<text x="930.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14213d" font-weight="400" text-anchor="start"><tspan x="930.0" dy="0.0">Pressão de memória e política de</tspan><tspan x="930.0" dy="16.2">despejo</tspan></text>
