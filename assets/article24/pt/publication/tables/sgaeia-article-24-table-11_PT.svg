<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="1253" viewBox="0 0 3400 1253">
<metadata id="sgaeia-publication-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><rdf:Description rdf:about=""><dc:title>Article 24 table 11</dc:title><dc:description>Pergunta orientadora | Resposta sustentada pela análise; Quando economiza preservando qualidade? | Quando heterogeneidade, calibração e capacidade de validação compensam decisão, repetição e operação; Quando supera referências simples? | Quando o ganho aparece no mesmo protocolo e permanece nas classes de tarefa relevantes; complexidade não o assegura; Que valor independe do algoritmo? | Mediação de acesso, gestão de recursos, observação e aplicação consistente de controles; Que risco decorre da concentração? | Uma falha pode alcançar credenciais, dados, configuração e evidências de muitas aplicações; O que muda com agentes e enxames? | Estado, delegação, concorrência e efeitos acumulados tornam a trajetória uma unidade necessária de avaliação; Que evidência permite governar? | Registros verificáveis de autoridade, política, destino efetivo, consumo, validação e resposta a mudanças</dc:description><dc:creator><rdf:Seq><rdf:li>Aridio Silva</rdf:li></rdf:Seq></dc:creator><dc:rights>© 2026 Aridio Silva — CC BY 4.0</dc:rights><dc:subject>SGAEIA</dc:subject><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></rdf:Description></rdf:RDF></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="68" font-family="Arial" font-size="41" font-weight="bold" fill="#b91c1c">Tabela 11</text>
<rect x="55" y="110" width="1645" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="72" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Pergunta orientadora</text>
<rect x="1700" y="110" width="1645" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="1717" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Resposta sustentada pela análise</text>
<rect x="55" y="211" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Quando economiza preservando qualidade?</text>
<rect x="1700" y="211" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1717" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Quando heterogeneidade, calibração e capacidade de validação compensam</text>
<text x="1717" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">decisão, repetição e operação</text>
<rect x="55" y="368" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Quando supera referências simples?</text>
<rect x="1700" y="368" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1717" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Quando o ganho aparece no mesmo protocolo e permanece nas classes de tarefa</text>
<text x="1717" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">relevantes; complexidade não o assegura</text>
<rect x="55" y="525" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Que valor independe do algoritmo?</text>
<rect x="1700" y="525" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1717" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Mediação de acesso, gestão de recursos, observação e aplicação consistente</text>
<text x="1717" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">de controles</text>
<rect x="55" y="682" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Que risco decorre da concentração?</text>
<rect x="1700" y="682" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1717" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Uma falha pode alcançar credenciais, dados, configuração e evidências de</text>
<text x="1717" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">muitas aplicações</text>
<rect x="55" y="839" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">O que muda com agentes e enxames?</text>
<rect x="1700" y="839" width="1645" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1717" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Estado, delegação, concorrência e efeitos acumulados tornam a trajetória uma</text>
<text x="1717" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">unidade necessária de avaliação</text>
<rect x="55" y="996" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Que evidência permite governar?</text>
<rect x="1700" y="996" width="1645" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1717" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Registros verificáveis de autoridade, política, destino efetivo, consumo,</text>
<text x="1717" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">validação e resposta a mudanças</text>
<text x="55" y="1218" font-family="Arial" font-size="25" fill="#536476">© 2026 Aridio Silva | Project SGAEIA | CC BY 4.0 | DOI: 10.5281/zenodo.23763978</text>
</svg>
