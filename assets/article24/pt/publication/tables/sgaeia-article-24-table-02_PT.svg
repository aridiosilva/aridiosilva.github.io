<text x="2046" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Transparência e baixo custo</text>
<text x="2046" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">de seleção</text>
<rect x="2687" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cobertura das regras e</text>
<text x="2704" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">tratamento de exceções</text>
