<text x="730" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Em geral, uma, além de</text>
<text x="730" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">eventuais embeddings</text>
<rect x="1371" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Dados rotulados e calibração</text>
