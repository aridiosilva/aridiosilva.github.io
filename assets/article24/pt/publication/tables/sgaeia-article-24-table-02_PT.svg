<text x="730" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">conforme o desenho</text>
<rect x="1371" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Exemplos, rubrica ou</text>
<text x="1388" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">avaliador</text>
