<text x="2046" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Aproveitamento incremental de</text>
<text x="2046" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">exemplos</text>
