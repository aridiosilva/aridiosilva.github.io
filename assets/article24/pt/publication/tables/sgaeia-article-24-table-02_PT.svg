<text x="2046" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Avaliação condicionada ao</text>
<text x="2046" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">resultado</text>
<rect x="2687" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Erros correlacionados e custo</text>
<text x="2704" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">adicional</text>
