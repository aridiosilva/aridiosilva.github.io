<text x="2704" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Custo de exploração,</text>
<text x="2704" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">estabilidade e explicação</text>
