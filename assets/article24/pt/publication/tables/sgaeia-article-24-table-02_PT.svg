<text x="72" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Adaptativo ou generativo</text>
<rect x="713" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Variável</text>
<rect x="1371" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Retorno observado ou</text>
<text x="1388" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">instruções de seleção</text>
<rect x="2029" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Adaptação a estado e contexto</text>
