<text x="2704" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cobertura e relevância dos</text>
<text x="2704" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">vizinhos</text>
<rect x="55" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cascata</text>
<rect x="713" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Uma ou mais</text>
<rect x="1371" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Critério de aceitação</text>
<rect x="2029" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Escalar somente quando</text>
<text x="2046" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">necessário</text>
<rect x="2687" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Confiabilidade e custo da</text>
<text x="2704" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">validação</text>
