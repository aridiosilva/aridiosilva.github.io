<text x="2046" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Seleção sem gerar respostas</text>
<text x="2046" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">alternativas</text>
<rect x="2687" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Representatividade dos dados</text>
