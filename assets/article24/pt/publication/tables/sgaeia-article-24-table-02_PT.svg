<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Regras</text>
<rect x="713" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Em geral, uma</text>
<rect x="1371" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Política e critérios</text>
<text x="1388" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">explícitos</text>
