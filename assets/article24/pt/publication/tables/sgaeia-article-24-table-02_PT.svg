<text x="730" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Em geral, uma, além da</text>
<text x="730" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">representação vetorial</text>
