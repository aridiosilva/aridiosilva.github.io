<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="782" viewBox="0 0 3400 782">
<metadata id="sgaeia-publication-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><rdf:Description rdf:about=""><dc:title>Article 24 table 9</dc:title><dc:description>Cenário | Conclusão por um indicador isolado | Conclusão com o quadro proposto | Evidência decisiva; Substituição de implantação | Menor custo e maior disponibilidade justificam a troca | A alternativa precisa satisfazer as restrições da tarefa | Política aplicável e destino efetivamente usado; Repetição multiagente | Todas as chamadas estão dentro do limite | O gasto agregado e a conclusão da tarefa precisam ser observados | Consumo por trajetória, tentativas e progresso; Reutilização de resposta | Alta similaridade favorece o cache | A validade depende também do contexto e da autorização | Estado, identidade e escopo da resposta reutilizada</dc:description><dc:creator><rdf:Seq><rdf:li>Aridio Silva</rdf:li></rdf:Seq></dc:creator><dc:rights>© 2026 Aridio Silva — CC BY 4.0</dc:rights><dc:subject>SGAEIA</dc:subject><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></rdf:Description></rdf:RDF></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="68" font-family="Arial" font-size="41" font-weight="bold" fill="#b91c1c">Tabela 9</text>
<rect x="55" y="110" width="822" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="72" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Cenário</text>
<rect x="877" y="110" width="822" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="894" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Conclusão por um indicador isolado</text>
<rect x="1699" y="110" width="822" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="1716" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Conclusão com o quadro proposto</text>
<rect x="2521" y="110" width="822" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="2538" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Evidência decisiva</text>
<rect x="55" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Substituição de implantação</text>
<rect x="877" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="894" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Menor custo e maior disponibilidade</text>
<text x="894" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">justificam a troca</text>
<rect x="1699" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1716" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">A alternativa precisa satisfazer as</text>
<text x="1716" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">restrições da tarefa</text>
<rect x="2521" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2538" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Política aplicável e destino</text>
<text x="2538" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">efetivamente usado</text>
<rect x="55" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Repetição multiagente</text>
<rect x="877" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="894" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Todas as chamadas estão dentro do</text>
<text x="894" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">limite</text>
<rect x="1699" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1716" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">O gasto agregado e a conclusão da</text>
<text x="1716" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">tarefa precisam ser observados</text>
<rect x="2521" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2538" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Consumo por trajetória, tentativas e</text>
<text x="2538" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">progresso</text>
<rect x="55" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Reutilização de resposta</text>
<rect x="877" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="894" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Alta similaridade favorece o cache</text>
<rect x="1699" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1716" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">A validade depende também do contexto</text>
<text x="1716" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">e da autorização</text>
<rect x="2521" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2538" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Estado, identidade e escopo da</text>
<text x="2538" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">resposta reutilizada</text>
<text x="55" y="747" font-family="Arial" font-size="25" fill="#536476">© 2026 Aridio Silva | Project SGAEIA | CC BY 4.0 | DOI: 10.5281/zenodo.23763978</text>
</svg>
