<text x="1388" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Explicit policies and</text>
<text x="1388" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">criteria</text>
