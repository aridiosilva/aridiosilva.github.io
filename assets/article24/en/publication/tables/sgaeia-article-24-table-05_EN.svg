<metadata id="sgaeia-publication-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><rdf:Description rdf:about=""><dc:title>Article 24 table 5</dc:title><dc:description>Evidence | What it supports | What it does not establish; FrugalGPT, Hybrid LLM, and AutoMix [[2](#ref-2)][[3](#ref-3)][[4](#ref-4)] | Some selection or escalation configurations lower cost while preserving their chosen quality measure | Transferable or directly comparable savings percentages; RouteLLM [[1](#ref-1)] | Preferences can guide efficient selection between models | A published threshold suitable for another organization's traffic; RouterBench [[5](#ref-5)] | Precomputed responses allow comparison against common references | Simulation of complete service behavior; LLMRouterBench [[6](#ref-6)] | Complementarity can coexist with difficulty beating simple baselines | Universal superiority of learned routing over a fixed policy; LLMRouter [[8](#ref-8)] | Common infrastructure supports study of different routing formulations | Operational readiness merely because an implementation exists</dc:description><dc:creator><rdf:Seq><rdf:li>Aridio Silva</rdf:li></rdf:Seq></dc:creator><dc:rights>© 2026 Aridio Silva — CC BY 4.0</dc:rights><dc:subject>SGAEIA</dc:subject><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></rdf:Description></rdf:RDF></metadata>
