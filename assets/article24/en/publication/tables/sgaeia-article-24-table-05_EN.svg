<text x="2264" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">What it does not establish</text>
<rect x="55" y="211" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">FrugalGPT, Hybrid LLM, and AutoMix [2][3][4]</text>
<rect x="1151" y="211" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1168" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Some selection or escalation configurations lower</text>
<text x="1168" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">cost while preserving their chosen quality measure</text>
<rect x="2247" y="211" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2264" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Transferable or directly comparable savings</text>
<text x="2264" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">percentages</text>
<rect x="55" y="368" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">RouteLLM [1]</text>
<rect x="1151" y="368" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1168" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Preferences can guide efficient selection between</text>
<text x="1168" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">models</text>
<rect x="2247" y="368" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2264" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">A published threshold suitable for another</text>
<text x="2264" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">organization&#x27;s traffic</text>
<rect x="55" y="525" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">RouterBench [5]</text>
<rect x="1151" y="525" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1168" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Precomputed responses allow comparison against</text>
<text x="1168" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">common references</text>
<rect x="2247" y="525" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2264" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Simulation of complete service behavior</text>
<rect x="55" y="682" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">LLMRouterBench [6]</text>
<rect x="1151" y="682" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1168" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Complementarity can coexist with difficulty</text>
<text x="1168" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">beating simple baselines</text>
<rect x="2247" y="682" width="1096" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2264" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Universal superiority of learned routing over a</text>
<text x="2264" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">fixed policy</text>
<rect x="55" y="839" width="1096" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">LLMRouter [8]</text>
