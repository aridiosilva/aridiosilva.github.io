<text x="72" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Evidence</text>
<rect x="1151" y="110" width="1096" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="1168" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">What it supports</text>
