<text x="1168" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Common infrastructure supports study of different</text>
<text x="1168" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">routing formulations</text>
