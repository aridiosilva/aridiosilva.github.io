<text x="730" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Adversarial robustness</text>
<rect x="1371" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="1388" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Agents and swarms</text>
<rect x="2029" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="2046" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Maturity to verify</text>
<rect x="2687" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="2704" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Operating complexity</text>
<rect x="55" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Rules</text>
<rect x="713" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Inputs may exploit exceptions</text>
<text x="730" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">and boundaries</text>
<rect x="1371" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Useful for mandatory</text>
<text x="1388" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">constraints and limits</text>
<rect x="2029" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Rule coverage and consistency</text>
<rect x="2687" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Grows with exception count</text>
<rect x="55" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Classifier</text>
<rect x="713" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Selection signals can be</text>
<text x="730" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">manipulated [9]</text>
<rect x="1371" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Should consider role, state,</text>
<text x="1388" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">and consequences</text>
<rect x="2029" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Calibration in the real</text>
<text x="2046" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">workflow</text>
<rect x="2687" y="368" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Data, training, versions, and</text>
<text x="2704" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">monitoring</text>
<rect x="55" y="525" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Similarity</text>
<rect x="713" y="525" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Adversarial content can</text>
<text x="730" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">influence neighborhoods</text>
<rect x="1371" y="525" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">History and context isolation</text>
<text x="1388" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">are decisive</text>
<rect x="2029" y="525" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Coverage and database updates</text>
<rect x="2687" y="525" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Index and supervision-data</text>
<text x="2704" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">management</text>
<rect x="55" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cascade</text>
<rect x="713" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Escalation criteria may be</text>
<text x="730" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">exploited</text>
<rect x="1371" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Needs a budget for the entire</text>
<text x="1388" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">trajectory</text>
<rect x="2029" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Escalation rate and</text>
<text x="2046" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">acceptance quality</text>
<rect x="2687" y="682" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="737" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">State and partial-failure</text>
<text x="2704" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">handling</text>
<rect x="55" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Judge or self-verification</text>
<rect x="713" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Evaluators also receive</text>
<text x="730" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">potentially hostile content</text>
<rect x="1371" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cross-review does not ensure</text>
<text x="1388" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">independence</text>
<rect x="2029" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Evaluator errors and</text>
<text x="2046" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">correlation</text>
<rect x="2687" y="839" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="894" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Rubrics, re-evaluation, and</text>
<text x="2704" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">disagreements</text>
<rect x="55" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Adaptive or generative</text>
<rect x="713" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Control decisions may absorb</text>
<text x="730" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">task instructions</text>
<rect x="1371" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">More context does not remove</text>
<text x="1388" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">authority limits</text>
<rect x="2029" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Stability under changes and</text>
<text x="2046" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">failures</text>
<rect x="2687" y="996" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="1051" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Exploration, rollback, and</text>
<text x="2704" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">continuous observation</text>
