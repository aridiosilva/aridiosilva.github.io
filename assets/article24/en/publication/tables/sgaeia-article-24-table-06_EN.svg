<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="1309" viewBox="0 0 3400 1309">
<metadata id="sgaeia-publication-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><rdf:Description rdf:about=""><dc:title>Article 24 table 6</dc:title><dc:description>Strategy | Quality and calibration | Cost and latency | Generalization | Auditability; Rules | Explicit criteria; exceptions require review | Low decision cost; usually one generation | Limited by policy coverage | Clear explanation of the rule applied; Classifier | Depends on supervision and threshold | Training and representation add cost; avoids alternative answers | Requires out-of-distribution evaluation | Needs recorded versions, signals, and decisions; Similarity | Depends on comparable examples | Retrieval and embeddings may be significant | Sensitive to database coverage | Neighbors and criteria can be recorded; Cascade | Depends on detecting inadequate answers | May accumulate generation, validation, and escalation | Verifier must also generalize | Acceptance and escalation can be traced; Judge or self-verification | Requires a rubric and false-acceptance measurement | Additional calls can dominate cost | May repeat generator errors | Scores and explanations do not replace evidence; Adaptive or generative | Depends on feedback, stability, and context | Exploration or planning adds operations | May adapt, with instability risks | Requires observation of policy and state changes</dc:description><dc:creator><rdf:Seq><rdf:li>Aridio Silva</rdf:li></rdf:Seq></dc:creator><dc:rights>© 2026 Aridio Silva — CC BY 4.0</dc:rights><dc:subject>SGAEIA</dc:subject><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></rdf:Description></rdf:RDF></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="68" font-family="Arial" font-size="41" font-weight="bold" fill="#b91c1c">Table 6</text>
<rect x="55" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="72" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Strategy</text>
<rect x="713" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="730" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Quality and calibration</text>
<rect x="1371" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="1388" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Cost and latency</text>
<rect x="2029" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="2046" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Generalization</text>
<rect x="2687" y="110" width="658" height="101" fill="#132742" stroke="#b9c7d8"/>
<text x="2704" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Auditability</text>
<rect x="55" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Rules</text>
<rect x="713" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Explicit criteria; exceptions</text>
<text x="730" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">require review</text>
<rect x="1371" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Low decision cost; usually</text>
<text x="1388" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">one generation</text>
<rect x="2029" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Limited by policy coverage</text>
<rect x="2687" y="211" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Clear explanation of the rule</text>
<text x="2704" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">applied</text>
<rect x="55" y="368" width="658" height="213" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Classifier</text>
<rect x="713" y="368" width="658" height="213" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Depends on supervision and</text>
<text x="730" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">threshold</text>
<rect x="1371" y="368" width="658" height="213" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Training and representation</text>
<text x="1388" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">add cost; avoids alternative</text>
<text x="1388" y="535" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">answers</text>
<rect x="2029" y="368" width="658" height="213" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Requires out-of-distribution</text>
<text x="2046" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">evaluation</text>
<rect x="2687" y="368" width="658" height="213" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Needs recorded versions,</text>
<text x="2704" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">signals, and decisions</text>
<rect x="55" y="581" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Similarity</text>
<rect x="713" y="581" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Depends on comparable</text>
<text x="730" y="692" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">examples</text>
<rect x="1371" y="581" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Retrieval and embeddings may</text>
<text x="1388" y="692" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">be significant</text>
<rect x="2029" y="581" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Sensitive to database</text>
<text x="2046" y="692" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">coverage</text>
<rect x="2687" y="581" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Neighbors and criteria can be</text>
<text x="2704" y="692" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">recorded</text>
<rect x="55" y="738" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Cascade</text>
<rect x="713" y="738" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Depends on detecting</text>
<text x="730" y="849" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">inadequate answers</text>
<rect x="1371" y="738" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">May accumulate generation,</text>
<text x="1388" y="849" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">validation, and escalation</text>
<rect x="2029" y="738" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Verifier must also generalize</text>
<rect x="2687" y="738" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="793" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Acceptance and escalation can</text>
<text x="2704" y="849" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">be traced</text>
<rect x="55" y="895" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Judge or self-verification</text>
<rect x="713" y="895" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="730" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Requires a rubric and false-</text>
<text x="730" y="1006" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">acceptance measurement</text>
<rect x="1371" y="895" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1388" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Additional calls can dominate</text>
<text x="1388" y="1006" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">cost</text>
<rect x="2029" y="895" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2046" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">May repeat generator errors</text>
<rect x="2687" y="895" width="658" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2704" y="950" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Scores and explanations do</text>
<text x="2704" y="1006" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">not replace evidence</text>
<rect x="55" y="1052" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Adaptive or generative</text>
<rect x="713" y="1052" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="730" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Depends on feedback,</text>
<text x="730" y="1163" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">stability, and context</text>
<rect x="1371" y="1052" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1388" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Exploration or planning adds</text>
<text x="1388" y="1163" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">operations</text>
<rect x="2029" y="1052" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2046" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">May adapt, with instability</text>
<text x="2046" y="1163" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">risks</text>
<rect x="2687" y="1052" width="658" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2704" y="1107" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Requires observation of</text>
<text x="2704" y="1163" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">policy and state changes</text>
<text x="55" y="1274" font-family="Arial" font-size="25" fill="#536476">© 2026 Aridio Silva | Project SGAEIA | CC BY 4.0 | DOI: 10.5281/zenodo.23763978</text>
</svg>
