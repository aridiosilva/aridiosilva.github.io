<text x="2538" y="165" font-family="Arial" font-size="41" font-weight="bold" fill="white">Decisive evidence</text>
<rect x="55" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Deployment substitution</text>
<rect x="877" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="894" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Lower cost and higher availability</text>
<text x="894" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">justify substitution</text>
<rect x="1699" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1716" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">The alternative must satisfy task</text>
<text x="1716" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">constraints</text>
<rect x="2521" y="211" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2538" y="266" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Applicable policy and actual</text>
<text x="2538" y="322" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">destination</text>
<rect x="55" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="72" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Multi-agent repetition</text>
<rect x="877" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="894" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Every call respects its limit</text>
<rect x="1699" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="1716" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Aggregate spending and task</text>
<text x="1716" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">completion must be observed</text>
<rect x="2521" y="368" width="822" height="157" fill="#f8fafc" stroke="#b9c7d8"/>
<text x="2538" y="423" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Trajectory consumption, attempts, and</text>
<text x="2538" y="479" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">progress</text>
<rect x="55" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="72" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Response reuse</text>
<rect x="877" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="894" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">High similarity favors caching</text>
<rect x="1699" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="1716" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">Validity also depends on context and</text>
<text x="1716" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">authorization</text>
<rect x="2521" y="525" width="822" height="157" fill="#edf3fa" stroke="#b9c7d8"/>
<text x="2538" y="580" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">State, identity, and scope of the</text>
<text x="2538" y="636" font-family="Arial" font-size="41" font-weight="normal" fill="#17212b">reused response</text>
